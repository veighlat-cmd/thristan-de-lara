<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plant Disease Detection: upload screen (mockup)</title>
  <link rel="stylesheet" href="plant.css">
</head>
<body>
  <div class="window">
    <div class="chrome">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>127.0.0.1:8000</div>
    </div>
    <main class="page">
      <div class="wrap">
        <h1 class="title">
          <span class="leaf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>
          Plant Disease Detection
        </h1>
        <section class="card intro">
          <p>Upload a clear image of a plant leaf to detect any diseases.</p>
          <div class="chips"><span>Apple</span><span>Corn</span><span>Grape</span><span>Tomato</span></div>
        </section>
        <div class="tabs">
          <span class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>File Upload</span>
          <span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Camera</span>
        </div>
        <section class="card upload">
          <div class="drop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <p>Drag and drop your image here or click to browse</p>
            <div class="file">Choose File <button type="button">Choose File</button> No file chosen</div>
          </div>
          <button class="analyze" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Analyze Plant</button>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
